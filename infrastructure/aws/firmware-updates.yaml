AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Agro Telemetry: OTA con IoT Jobs. Un bucket privado guarda los binarios,
  un rol deja que Jobs firme URLs de descarga de corta duración, y el
  usuario de la CLI puede subir firmware y crear Jobs. Para borrar el stack,
  el bucket tiene que estar vacío.

Resources:
  # Privado y cifrado: los nodos nunca acceden directo, solo con la URL
  # firmada que trae cada Job.
  FirmwareBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      # Un binario solo hace falta mientras su Job está en curso.
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-firmware
            Status: Enabled
            ExpirationInDays: 30

  # Lo asume IoT Jobs al entregar un Job, para firmar la URL de descarga.
  # Solo puede leer los binarios de este bucket.
  SigningRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: iot.amazonaws.com
            Action: sts:AssumeRole
            # Solo IoT, en nombre de un Job de esta cuenta (confused deputy).
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:job/*
      Policies:
        - PolicyName: read-firmware
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub ${FirmwareBucket.Arn}/firmware/*

  # Lo que hace falta para publicar una versión, además de crear el Job:
  # subir el binario y pasarle el rol de firma a IoT. PassRole existe para
  # que nadie le preste a un servicio un rol con más permisos que los suyos.
  FirmwarePublisherPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Subir firmware al bucket de OTA y crear Jobs que lo firmen.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: s3:PutObject
            Resource: !Sub ${FirmwareBucket.Arn}/firmware/*
          - Effect: Allow
            Action: iam:PassRole
            Resource: !GetAtt SigningRole.Arn
            Condition:
              StringEquals:
                iam:PassedToService: iot.amazonaws.com

  # El usuario de la CLI para todo el experimento, con nombre de función.
  # Sin claves: se crean en la consola, para que el secreto no quede en
  # las salidas del stack.
  CliUser:
    Type: AWS::IAM::User
    Properties:
      UserName: agro-iot-cli
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AWSIoTFullAccess
        - !Ref FirmwarePublisherPolicy

Outputs:
  BucketName:
    Value: !Ref FirmwareBucket
  SigningRoleArn:
    Value: !GetAtt SigningRole.Arn
  CliUserName:
    Value: !Ref CliUser
