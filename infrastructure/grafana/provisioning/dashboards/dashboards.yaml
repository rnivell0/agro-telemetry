apiVersion: 1

providers:
  - name: Agro Telemetry
    orgId: 1
    folder: Agro Telemetry
    folderUid: agro-telemetry
    type: file
    disableDeletion: false
    allowUiUpdates: false
    updateIntervalSeconds: 10
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: false
