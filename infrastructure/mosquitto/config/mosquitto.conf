# MQTT sobre TLS, accesible desde todas las interfaces de la PC, incluida
# la LAN. Reemplaza al listener 1883 sin cifrar de la primera etapa.
listener 8883 0.0.0.0
protocol mqtt
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
# TLS de servidor solamente: el cliente valida el certificado del broker,
# pero el broker no exige un certificado de cliente (eso seria mTLS).
require_certificate false

# Ya no se permiten conexiones anonimas: todo cliente debe autenticarse
# con usuario y contraseña ademas de la conexion TLS.
allow_anonymous false
password_file /mosquitto/config/passwd

# Qué puede publicar y leer cada usuario autenticado (ver config/acl).
acl_file /mosquitto/config/acl

# Conserva sesiones y mensajes persistentes fuera del contenedor.
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

# Escribe los logs en el volumen montado.
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
